services:
  ollama:
    image: ollama/ollama:latest
    container_name: agent_ia_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_ia_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: agent_ia_mcp
    environment:
      - MCP_MOUNT_PATH=/mcp
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434

      # ---- Atlassian (désactivé par défaut) ----
      - ENABLE_ATLASSIAN_TOOLS=false
      - ATLASSIAN_BASE_URL=https://xxx.atlassian.net
      - ATLASSIAN_EMAIL=toi@domaine.com
      - ATLASSIAN_API_TOKEN=xxxxxxxx
      - JIRA_PROJECT_KEY=ABC
      - CONFLUENCE_SPACE_KEY=SPACE
      - CONFLUENCE_PARENT_ID=123456   # optionnel
      # Epic name custom field (optionnel, dépend de ton Jira)
      - JIRA_EPIC_NAME_FIELD=customfield_XXXXX # optionnel

    depends_on:
      - qdrant
      - ollama
    ports:
      - "8001:8001"
    restart: unless-stopped

  api:
    # ⚠️ adapte le build selon ton repo :
    # - si tu as un Dockerfile à la racine : context: .
    # - sinon : context: ./api (ou ./src)
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: agent_ia_api
    environment:
      - MCP_URL=http://mcp:8001/mcp
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - mcp
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
