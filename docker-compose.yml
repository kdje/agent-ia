services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_ia_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  copilot-api:
    build: .
    container_name: agent_ia_copilot_api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      COPILOT_MODEL: "qwen2.5:14b-instruct"
      EMBED_MODEL: "bge-m3"
      PYTHONPATH: "/app"
    depends_on:
      - qdrant
    restart: unless-stopped
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "debug"]

volumes:
  qdrant_storage:
